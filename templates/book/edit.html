{% extends "base.html" %}

{% block title %}Sửa Sách - Quản lý Thư viện{% endblock %}

{% block content %}
<div class="container-fluid main-content">
    <div class="page-header">
        <h1><i class="fas fa-edit"></i> Sửa Sách</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="title" class="form-label">Tên Sách</label>
                                <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label">Tác Giả</label>
                                <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="publisher" class="form-label">Nhà Xuất Bản</label>
                                <input type="text" class="form-control" id="publisher" name="publisher" value="{{ book.publisher or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="published_year" class="form-label">Năm Xuất Bản</label>
                                <input type="number" class="form-control" id="published_year" name="published_year" value="{{ book.published_year or '' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="total_copies" class="form-label">Tổng Bản</label>
                            <input type="number" class="form-control" id="total_copies" name="total_copies" value="{{ book.total_copies }}">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô Tả</label>
                            <textarea class="form-control" id="description" name="description" rows="4">{{ book.description or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="categories" class="form-label">Thể Loại</label>
                            <select class="form-select" id="categories" name="categories" multiple>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if cat in book.categories %}selected{% endif %}>
                                        {{ cat.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('book.detail', book_id=book.id) }}" class="btn btn-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Lưu Thay Đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
